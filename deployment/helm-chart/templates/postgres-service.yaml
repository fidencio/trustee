{{- if eq (include "coco-trustee.postgres.useBundled" . | trim) "true" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "coco-trustee.names.postgres" . }}
  labels:
    {{- include "coco-trustee.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: postgres
    {{- include "coco-trustee.selectorLabels" . | nindent 4 }}
  ports:
    - name: tcp
      port: {{ include "coco-trustee.port.postgres" . }}
      targetPort: {{ include "coco-trustee.port.postgres" . }}
      protocol: TCP
{{- end }}
